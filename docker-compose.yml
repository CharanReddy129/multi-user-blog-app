services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: blog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d blogdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://bloguser:blogpassword@postgres:5432/blogdb
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_please}
      NODE_ENV: production
      FRONTEND_URL: http://172.30.85.64:3000
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blog_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://172.30.85.64:5000
    ports:
      - "3000:3000"

  # DB migration + seed runner (runs once and exits)
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bloguser:blogpassword@postgres:5432/blogdb
    command: sh -c "npm run migrate && npm run seed"
    restart: "no"

volumes:
  postgres_data:
  uploads_data:
